<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes">
  <!-- No-op until loaded dynamically (could make configurable) -->
  <link rel="icon" href="./marca/glifo.svg">
  <!-- STYLESHEETS (others loaded dynamically) -->
  <style id="styleoverrides" media="screen"></style>
  <link href="./svgedit.css" rel="stylesheet" media="all">
  <script>
    // GitHub Pages deja cada archivo 10 minutos en la caché del navegador. Los
    // propios de RapidoGraph cambian seguido, así que se piden con una marca
    // distinta en cada carga; el motor de SVG-Edit sí se sigue cacheando.
    window.RG_VERSION = '?v=' + Date.now()
    document.write('<link href="./personalizacion.css' + RG_VERSION + '" rel="stylesheet" media="all">' +
      '<link href="./rapidograph.css' + RG_VERSION + '" rel="stylesheet" media="all">')
  </script>
  <!-- Lacking browser support -->
  <script type="module" src="./browser-not-supported.js"></script>
  <title>RapidoGraph</title>
</head>

<body style="margin:0">
<script>
  // Si el dibujo guardado del navegador quedó corrupto (causaba el aviso
  // "Unable to load SVG data" al abrir), se descarta antes de arrancar.
  try {
    for (const clave of Object.keys(localStorage)) {
      if (!clave.startsWith('svgedit-')) continue
      const valor = localStorage.getItem(clave) || ''
      if (valor && !valor.includes('<svg')) localStorage.removeItem(clave)
    }
  } catch (e) { /* sin almacenamiento */ }
</script>

  <!-- svgedit container can be positionned anywhere in the DOM
       but it must have a width and a height -->
  <!--
  <h1>SVGEdit</h1>
  <div id="container" style="width:100%;height:550px"></div>
  <h1>End</h1>
  -->
  <div id="container" style="width:100%;height:100vh"></div>
</body>
<!-- If you do not wish to add extensions by URL, you can add calls
      within the following file to svgEditor.setConfig -->
<script type="module">
  import Editor from './Editor.js'
  /* for available options see the file `docs/tutorials/ConfigOptions.md */
  const svgEditor = new Editor(document.getElementById('container'))
  svgEditor.setConfig({
    allowInitialUserOverride: true,
    extensions: [],
    noDefaultExtensions: false,
    // guarda preferencias y dibujo localmente SIN preguntar: el diálogo de
    // consentimiento de almacenamiento se abría invisible y bloqueaba el mouse
    forceStorage: true,
    userExtensions: [/* { pathName: '/packages/react-test/dist/react-test.js' } */]
  })
  svgEditor.init()
  if (typeof XDOMAIN !== 'undefined' && XDOMAIN) {
    svgEditor.setConfig({
      canvasName: 'xdomain', // Namespace this
      allowedOrigins: ['*']
    })
    console.info('xdomain config activated')
  }
</script>
<script type="module">
  for (const modulo of ['./rapidograph.js', './anotador.js']) {
    import(modulo + window.RG_VERSION).catch(e => console.error('No cargó ' + modulo, e))
  }
</script>

</html>
